[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metalist"
dynamic = ["version"]
description = "A minimalist single-user note-taking app with SSR, fast in-memory tree operations, and efficient sync."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "argon2-cffi==25.1.0",
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "instructor==1.15.4",
    "latex2mathml==3.81.0",
    "loguru==0.7.3",
    "Mako==1.3.12",
    "nh3==0.3.6",
    "openai==2.54.0",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "starlette==1.3.1",
    "tqdm==4.70.0",
    "tree-sitter==0.25.2",
    "tree-sitter-javascript==0.25.0",
    "typing_extensions==4.16.0",
    "uvicorn==0.52.0",
    "zxcvbn==4.5.0",
]

[project.urls]
Homepage = "https://github.com/evolvingstuff/metalist"
Repository = "https://github.com/evolvingstuff/metalist"
Issues = "https://github.com/evolvingstuff/metalist/issues"

[project.optional-dependencies]
dev = [
    "hypothesis==6.164.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[project.scripts]
metalist = "main:cli"
metalist-audit-encryption = "app.encryption_audit:cli"

[tool.setuptools]
include-package-data = true
py-modules = ["main"]
script-files = ["convert-from-legacy.py", "scripts/generate-lan-cert.sh"]

[tool.setuptools.package-data]
"app.services.agent.prompts" = ["*.md"]
"app.services.agent.skills" = ["*.md"]

[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["app.__pycache__*"]

[tool.setuptools.exclude-package-data]
app = [
    ".DS_Store",
    "__pycache__/*",
    "static/.DS_Store",
    "static/js/.DS_Store",
]

[dependency-groups]
release = [
    "build==1.6.1",
    "pip-audit==2.10.1",
    "setuptools==83.0.0",
    "uv==0.11.23",
    "wheel==0.48.0",
]

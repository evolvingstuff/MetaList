<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${page_title}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .maintenance-container {
            text-align: center;
            max-width: 400px;
            padding: 40px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #4a9eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .description {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 20px;
        }
        
        .status {
            font-size: 14px;
            color: #888;
        }
        
        .retry-info {
            font-size: 12px;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="spinner"></div>
        <h1>Processing...</h1>
        <div class="description" id="operation-description">
            Please wait while the operation completes
        </div>
        <div class="status">
            This may take some time for large collections
        </div>
        <div class="retry-info">
            Checking every 200ms...
        </div>
    </div>

    <script type="module" src="/static/js/modules/maintenance.js?v=${asset_version}"></script>
</body>
</html>

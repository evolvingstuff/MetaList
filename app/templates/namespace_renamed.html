<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>${page_title}</title>
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico?v=${asset_version}">
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #08111e;
            color: #f4f7fb;
        }
        main {
            width: min(680px, 100%);
            padding: 38px;
            border: 1px solid #334155;
            border-radius: 24px;
            background: #0d1726;
            box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
        }
        h1 { margin: 0 0 16px; font-size: clamp(2rem, 6vw, 3.4rem); }
        p { margin: 0; color: #cbd5e1; font-size: 1.1rem; line-height: 1.6; }
        #namespace-rename-status {
            margin-top: 28px;
            padding: 18px 20px;
            border-radius: 14px;
            background: #172554;
        }
        #namespace-rename-status[data-state="succeeded"] { background: #14532d; }
        #namespace-rename-status[data-state="failed"] { background: #7f1d1d; }
        #namespace-rename-error {
            margin-top: 18px;
            padding: 16px;
            overflow-x: auto;
            white-space: pre-wrap;
            border-radius: 12px;
            background: #020617;
            color: #fecaca;
        }
        .hidden { display: none; }
        a { color: #bfdbfe; }
    </style>
</head>
<body>
    <main>
        <h1 id="namespace-rename-title">Renaming ${source_namespace} to ${target_namespace}</h1>
        <p id="namespace-rename-copy">MetaList is moving the vault data and restarting it on the same ports.</p>
        <section id="namespace-rename-status" data-state="pending">
            <p id="namespace-rename-status-text">Rename in progress. This page will update automatically.</p>
        </section>
        <pre id="namespace-rename-error" class="hidden"></pre>
    </main>
    <script nonce="${request.state.csp_nonce}">
        window.__METALIST_NAMESPACE_RENAMED__ = ${page_state_json | n};
    </script>
    <script type="module" src="/static/js/namespace-renamed.js?v=${asset_version}"></script>
</body>
</html>

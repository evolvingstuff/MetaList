name: Publish to PyPI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build and test dependencies
        run: python -m pip install --upgrade build ".[dev]"

      - name: Run Python unit suite
        run: python -m pytest -q tests/unit

      - name: Run JavaScript unit suite
        run: node --test tests/unit/*.mjs

      - name: Run actual Python and JavaScript startup sanity gates
        run: >-
          python -c "from pathlib import Path;
          from app.startup_sanity import assert_startup_sanity;
          from app.startup_js_sanity import assert_startup_js_sanity;
          assert_startup_sanity(Path.cwd());
          assert_startup_js_sanity(Path.cwd())"

      - name: Build distribution
        run: python -m build

      - name: Verify wheel and source distribution contents
        run: python scripts/check_distribution.py dist

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  smoke:
    name: Smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository for smoke test script
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist

      - name: Create clean installed-package environment
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -c "import os, pathlib, venv;
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'metalist-smoke';
          venv.EnvBuilder(with_pip=True).create(directory);
          executables = directory / ('Scripts' if os.name == 'nt' else 'bin');
          path_file = pathlib.Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8');
          path_file.write(str(executables) + os.linesep);
          path_file.close()"

      - name: Install built wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -c "import os, pathlib, subprocess, sys;
          wheels = list(pathlib.Path(os.environ['GITHUB_WORKSPACE']).joinpath('dist').glob('*.whl'));
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-I', '-m', 'pip', 'install', str(wheels[0])])"

      - name: Check installed dependencies
        working-directory: ${{ runner.temp }}
        run: python -I -m pip check

      - name: Smoke test installed CLI and HTTP/HTTPS namespace startup
        working-directory: ${{ runner.temp }}
        run: python -I "${{ github.workspace }}/scripts/smoke_installed_package.py"

  publish:
    needs: [build, smoke]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

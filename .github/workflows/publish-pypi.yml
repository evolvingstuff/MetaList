name: Publish to PyPI

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-pypi-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install build dependencies
        run: python -m pip install --require-hashes -r requirements/ci.txt

      - name: Check lock exports, vendor checksums, and Action pins
        run: python scripts/check_supply_chain.py check

      - name: Audit all locked Python and vendored browser versions
        run: python scripts/check_supply_chain.py audit --output audit-results

      - name: Preserve dependency audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit
          path: audit-results/
          if-no-files-found: error

      - name: Build distribution once
        run: python -m build --no-isolation

      - name: Verify wheel and source distribution contents
        run: python scripts/check_distribution.py dist

      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  python-tests:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Python (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install hash-verified test dependencies
        run: python -m pip install --require-hashes -r requirements/ci.txt

      - name: Run Python unit suite
        run: python -m pytest -q tests/unit

  platform-checks:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: JavaScript and sanity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install hash-verified test dependencies
        run: python -m pip install --require-hashes -r requirements/ci.txt

      - name: Run JavaScript unit suite
        run: node --test tests/unit/*.mjs

      - name: Run Python and JavaScript startup sanity gates
        run: >-
          python -c "from pathlib import Path;
          from app.startup_sanity import assert_startup_sanity;
          from app.startup_js_sanity import assert_startup_js_sanity;
          assert_startup_sanity(Path.cwd());
          assert_startup_js_sanity(Path.cwd())"

      - name: Type check against the known-error baseline
        run: python scripts/check_types.py check

  installed-package:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Package and update (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository for smoke scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements/runtime.txt
            requirements/updater.txt

      - name: Download the single verified distribution build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist

      - name: Create clean installed-package environment
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -c "import os, pathlib, venv;
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'metalist-smoke';
          venv.EnvBuilder(with_pip=True).create(directory);
          executables = directory / ('Scripts' if os.name == 'nt' else 'bin');
          path_file = pathlib.Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8');
          path_file.write(str(executables) + os.linesep);
          path_file.close()"

      - name: Install hash-verified runtime dependencies
        working-directory: ${{ runner.temp }}
        run: python -I -m pip install --require-hashes -r "${{ github.workspace }}/requirements/runtime.txt"

      - name: Install built wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -c "import os, pathlib, subprocess, sys;
          wheels = list(pathlib.Path(os.environ['GITHUB_WORKSPACE']).joinpath('dist').glob('*.whl'));
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-I', '-m', 'pip', 'install', '--no-deps', str(wheels[0])])"

      - name: Check installed dependencies
        working-directory: ${{ runner.temp }}
        run: python -I -m pip check

      - name: Smoke test installed CLI and complete HTTP/HTTPS asset loading
        working-directory: ${{ runner.temp }}
        run: >-
          python -I "${{ github.workspace }}/scripts/smoke_installed_package.py"
          --browser-cold-runs 1 --browser-reloads 1

      - name: Install pinned fixture uv for real self-update validation
        working-directory: ${{ runner.temp }}
        run: python -I -m pip install --require-hashes --no-deps -r "${{ github.workspace }}/requirements/updater.txt"

      - name: Test real uv update and namespace restart
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -c "import os, pathlib, subprocess, sys;
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']);
          wheels = list((root / 'dist').glob('*.whl'));
          assert len(wheels) == 1;
          subprocess.check_call([sys.executable, '-I', str(root / 'scripts/smoke_self_update.py'), str(wheels[0])])"

  browser-smoke:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Browser smoke (${{ matrix.label }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux Chrome and Firefox
            arguments: --browser chrome --browser firefox
            artifact: linux-chrome-firefox
          - os: macos-latest
            label: macOS Chrome and Firefox
            arguments: --browser chrome --browser firefox
            artifact: macos-chrome-firefox
          - os: windows-latest
            label: Windows Chrome and Firefox
            arguments: --browser chrome --browser firefox
            artifact: windows-chrome-firefox
          - os: windows-latest
            label: Windows Edge HTTPS
            arguments: --https-browser edge
            artifact: windows-edge-https
    steps:
      - name: Check out repository for browser scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/runtime.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/browser-validation/package-lock.json

      - name: Download the single verified distribution build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist

      - name: Create clean browser environment
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -c "import os, pathlib, venv;
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'metalist-browser';
          venv.EnvBuilder(with_pip=True).create(directory);
          executables = directory / ('Scripts' if os.name == 'nt' else 'bin');
          path_file = pathlib.Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8');
          path_file.write(str(executables) + os.linesep);
          path_file.close()"

      - name: Install runtime and exact built wheel
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -c "import os, pathlib, subprocess, sys;
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']);
          wheels = list((root / 'dist').glob('*.whl'));
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-I', '-m', 'pip', 'install', '--require-hashes', '-r', str(root / 'requirements/runtime.txt')]);
          subprocess.check_call([sys.executable, '-I', '-m', 'pip', 'install', '--no-deps', str(wheels[0])])"

      - name: Install locked browser driver
        run: npm ci --prefix scripts/browser-validation --ignore-scripts --no-audit --no-fund

      - name: Run one cold browser startup, reload, and encrypted login
        working-directory: ${{ runner.temp }}
        run: >-
          python -I "${{ github.workspace }}/scripts/smoke_installed_package.py"
          --browser-cold-runs 1 --browser-reloads 2
          ${{ matrix.arguments }}

      - name: Preserve browser smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke-${{ matrix.artifact }}
          path: ${{ runner.temp }}/metalist-browser-results/
          if-no-files-found: warn

  browser-soak:
    name: Browser soak (${{ matrix.label }})
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux Chrome and Firefox
            arguments: --browser chrome --browser firefox
            artifact: linux-chrome-firefox
          - os: macos-latest
            label: macOS Chrome and Firefox
            arguments: --browser chrome --browser firefox
            artifact: macos-chrome-firefox
          - os: windows-latest
            label: Windows Chrome and Firefox
            arguments: --browser chrome --browser firefox
            artifact: windows-chrome-firefox
          - os: windows-latest
            label: Windows Edge HTTPS
            arguments: --https-browser edge
            artifact: windows-edge-https
    steps:
      - name: Check out repository for browser scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/runtime.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/browser-validation/package-lock.json

      - name: Download the single verified distribution build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist

      - name: Create clean browser environment
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -c "import os, pathlib, venv;
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'metalist-browser-soak';
          venv.EnvBuilder(with_pip=True).create(directory);
          executables = directory / ('Scripts' if os.name == 'nt' else 'bin');
          path_file = pathlib.Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8');
          path_file.write(str(executables) + os.linesep);
          path_file.close()"

      - name: Install runtime and exact built wheel
        working-directory: ${{ runner.temp }}
        run: >-
          python -I -c "import os, pathlib, subprocess, sys;
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']);
          wheels = list((root / 'dist').glob('*.whl'));
          assert len(wheels) == 1, wheels;
          subprocess.check_call([sys.executable, '-I', '-m', 'pip', 'install', '--require-hashes', '-r', str(root / 'requirements/runtime.txt')]);
          subprocess.check_call([sys.executable, '-I', '-m', 'pip', 'install', '--no-deps', str(wheels[0])])"

      - name: Install locked browser driver
        run: npm ci --prefix scripts/browser-validation --ignore-scripts --no-audit --no-fund

      - name: Run repeated cold starts and uncached reloads
        working-directory: ${{ runner.temp }}
        run: >-
          python -I "${{ github.workspace }}/scripts/smoke_installed_package.py"
          --browser-cold-runs 3 --browser-reloads 3 --skip-browser-login
          ${{ matrix.arguments }}

      - name: Preserve browser soak diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-soak-${{ matrix.artifact }}
          path: ${{ runner.temp }}/metalist-browser-results/
          if-no-files-found: warn

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Find successful exact-commit main validation
        id: validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/resolve_release_validation.py

      - name: Download tested distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist
          run-id: ${{ steps.validation.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify downloaded release files match the tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/resolve_release_validation.py --check-distributions dist

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/

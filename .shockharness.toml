# Tests and the browser test harness: fixtures encode literal expected values, test
# doubles take defaults, and harness catches add diagnostics (a screenshot, the
# step) before rethrowing. MetaList's own startup gates still apply their rules there.
[[tool.shockharness.overrides]]
paths = ["tests/**"]
disable = ["MAGIC001", "DEF001", "DEF002"]
reason = "Assertions and fixtures spell out the literal values they expect; test doubles and fixture builders take defaults, and answer a missing key with a default as the stores they stand in for do"

# The browser test suites are tests too; their numbers are click offsets,
# waits and expected positions.
[[tool.shockharness.overrides]]
paths = ["scripts/browser-*.mjs", "scripts/browser-validation/**", "scripts/suite-outcome.mjs"]
disable = ["MAGIC001"]
reason = "Browser test suites spell out the positions, offsets and waits they check, like the unit tests"

[tool.shockharness.cache]
enabled = true
directory = ".shockharness-cache"
